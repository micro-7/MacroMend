name: Create upload keystore

# Run this ONCE by hand (Actions -> Create upload keystore -> Run workflow). It creates the key that signs the
# app you upload to Google Play and puts it, with the four secret values, in a private artifact. Follow
# docs/release.md: download the artifact, save the four secrets, keep the keystore somewhere safe, then delete the artifact.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore and secret values
        run: |
          set -euo pipefail
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore out/upload-keystore.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MacroMend, O=MacroMend, C=IN" > /dev/null 2>&1
          {
            echo "ANDROID_UPLOAD_KEYSTORE_B64=$(base64 -w0 out/upload-keystore.jks)"
            echo "ANDROID_UPLOAD_STORE_PASSWORD=$PASS"
            echo "ANDROID_UPLOAD_KEY_ALIAS=upload"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=$PASS"
          } > out/secrets.txt

      - name: Upload (private artifact, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: macromend-upload-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
